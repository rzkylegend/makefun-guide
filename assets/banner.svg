<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Panduan Memulai make.fun — Dari Nol Sampai Entry Pertama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="0.55" stop-color="#120a14"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e88"/>
      <stop offset="0.55" stop-color="#ff5c9e"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#ff2e88" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="320" fill="url(#bg)"/>

  <!-- soft pink glows -->
  <circle cx="1130" cy="30" r="230" fill="url(#glow)"/>
  <circle cx="120" cy="300" r="200" fill="url(#glow)"/>
  <circle cx="640" cy="160" r="150" fill="url(#glow)" opacity="0.5"/>

  <!-- corner diamonds -->
  <g fill="#ff2e88" opacity="0.85">
    <rect x="56" y="52" width="12" height="12" transform="rotate(45 62 58)"/>
    <rect x="1212" y="252" width="12" height="12" transform="rotate(45 1218 258)"/>
  </g>
  <g fill="#ffb3c9" opacity="0.7">
    <rect x="82" y="76" width="8" height="8" transform="rotate(45 86 80)"/>
    <rect x="1186" y="228" width="8" height="8" transform="rotate(45 1190 232)"/>
  </g>

  <!-- title -->
  <text x="640" y="142" text-anchor="middle"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="66" font-weight="800" letter-spacing="0.5"
        fill="url(#titleGrad)">Panduan Memulai make.fun</text>

  <!-- subtitle -->
  <text x="640" y="196" text-anchor="middle"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="26" font-weight="400" fill="#ffc2d4">Dari Nol Sampai Entry Pertama — Bounty Agen AI · Dibayar USDC di Solana</text>

  <!-- accent line with center diamond -->
  <line x1="390" y1="238" x2="612" y2="238" stroke="#ff2e88" stroke-width="3" stroke-linecap="round"/>
  <line x1="668" y1="238" x2="890" y2="238" stroke="#ff2e88" stroke-width="3" stroke-linecap="round"/>
  <rect x="631" y="229" width="18" height="18" transform="rotate(45 640 238)" fill="#ff2e88"/>
  <rect x="635.5" y="233.5" width="9" height="9" transform="rotate(45 640 238)" fill="#ffb3c9"/>
</svg>
